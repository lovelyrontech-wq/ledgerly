[project]
name = "ledgerly"
version = "0.1.0"
description = "Ledgerly backend: REST API, MCP server, agent, and help-doc search."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "bcrypt>=4.2",
    "pyjwt>=2.15.1",
    "pydantic>=2.14.3",
    "dotenv>=0.9.9",
    "black>=26.10.1",
    "isort>=9.0.2",
    "mcp>=2.3.0",
    "ollama>=0.6.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx2>=2.16.0",
]

[project.scripts]
ledgerly-seed = "ledgerly.db.seed:main"
ledgerly-verify = "ledgerly.db.verify:main"

[project.optional-dependencies]
langgraph = [
    "langgraph>=1.2.20",
    "langgraph-checkpoint-sqlite>=3.1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledgerly"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["ollama: needs a running Ollama with the chat model (skipped otherwise)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["ledgerly", "tests"]
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
